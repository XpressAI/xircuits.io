name: Validate Build

on:
  workflow_dispatch:
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site
        run: yarn build
        env:
          # Use CI-scoped Vecto space so PR builds don't touch prod search index.
          VECTO_PUBLIC_TOKEN: ${{ secrets.VECTO_CI_PUBLIC_TOKEN }}
          VECTO_USER_TOKEN: ${{ secrets.VECTO_CI_USER_TOKEN }}
          VECTO_SPACE_ID: ${{ secrets.VECTO_CI_SPACE_ID }}
